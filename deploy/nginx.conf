# nginx for cluelake.com, baked into the image.
#
# ⚠ IT LIVES HERE AND NOT IN A ConfigMap. The config and the files it serves are
# one artifact: a change to either produces a new image digest, and the digest is
# what the Deployment pins. A ConfigMap could change the response headers under a
# running pod — a deploy nobody initiated and nothing records.

server {
  # 8080, not 80: the container runs unprivileged and cannot bind a low port.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The image ships a pre-compressed .gz beside every asset, so nginx spends no
  # CPU per request and the bytes on the wire come from gzip -9 rather than -6.
  # `gzip on` stays as the fallback for anything without a .gz twin.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  # text/html is not listed on purpose: it is always compressed when gzip is on,
  # and listing it makes nginx warn about a duplicate MIME type.
  gzip_types text/css application/javascript image/svg+xml application/json;

  # ⚠ THE PROBE PATH IS NOT index.html. A readiness probe that fetches the page
  # goes green whenever nginx can serve bytes, which it can before the assets are
  # in place. This is a distinct 200 with no body and no logging.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }

  # Hashed assets are immutable by construction — the filename changes when the
  # content does — so they can be cached for a year. index.html must NOT be:
  # it is the file that names the current asset hashes, and a cached one points
  # at assets that no longer exist after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Routing is hash-based (`/#/brand`), so every real request is for the root
  # document or a static file. Anything unmatched falls back to index.html
  # rather than 404ing, which keeps a stray path from showing an nginx error
  # page carrying a version number.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ⚠ THE CSP ALLOWS Google Fonts AND NOTHING ELSE OFF-ORIGIN. The page loads
  # Inter and JetBrains Mono from fonts.googleapis.com; every other external
  # origin is refused. `style-src` needs 'unsafe-inline' because the site styles
  # components with inline `style` attributes — that is a real relaxation and it
  # is the reason script-src stays strict.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # nginx puts its version in the Server header and on its error pages. Neither
  # is useful to a visitor and both are useful to somebody scanning.
  server_tokens off;
}
