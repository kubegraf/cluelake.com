<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ClueLake: three signal nodes converging on one evidence node.
       Geometry mirrors src/brand/marks.tsx. Dark tile, so the mark survives
       both a light and a dark browser chrome without a second file. -->
  <rect width="32" height="32" rx="7" fill="#0a0d12"/>
  <g transform="translate(16 16) scale(0.78) translate(-16 -16)">
    <g stroke="#78849a" stroke-width="1.7" stroke-linecap="round" opacity="0.62">
      <line x1="8.5" y1="7.5" x2="23.5" y2="16"/>
      <line x1="6" y1="16" x2="23.5" y2="16"/>
      <line x1="8.5" y1="24.5" x2="23.5" y2="16"/>
    </g>
    <g fill="#78849a">
      <circle cx="8.5" cy="7.5" r="2.1"/>
      <circle cx="6" cy="16" r="2.6"/>
      <circle cx="8.5" cy="24.5" r="2.1"/>
    </g>
    <circle cx="23.5" cy="16" r="4.6" fill="#17ddbe"/>
  </g>
</svg>
