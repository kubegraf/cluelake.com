# ⚠ `ubuntu-latest`, NOT `kubegraf-org-runners`, BECAUSE THIS REPO IS PUBLIC.
# The org label silently never runs in a public repository — the Default runner
# group is `allows_public_repositories: false`, so the job queues until somebody
# cancels it with nothing in the log to read. If this repo is ever made private,
# this line changes in the same commit.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to ECR Public: setup-buildx's default driver pulls moby/buildkit
      # from Docker Hub unauthenticated, which failed nine times across this org
      # in one day on 2026-09-12.
      - uses: docker/setup-buildx-action@v3
        id: buildx
        continue-on-error: true
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - name: Build
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://cluelake.com \
            --tag cluelake-web:ci --load .
      - name: It serves
        run: |
          set -euo pipefail
          docker run -d --name web -p 3000:3000 cluelake-web:ci
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)"
            [ "$code" = "200" ] && { echo "serving"; docker rm -f web; exit 0; }
            sleep 2
          done
          echo "::error::the container never served 200"; docker logs web; docker rm -f web; exit 1

  secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          set -euo pipefail
          if git grep -nE 're_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' -- . ':!*.example'; then
            echo "::error::a credential literal is committed"; exit 1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- .; then
            echo "::error::a private key is committed"; exit 1
          fi
          echo clean
