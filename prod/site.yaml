# ============================================================================
# cluelake.com on kubegraf-prod.
#
# The ClueLake marketing site: a Next.js server, built into one image with its
# content. Listens on 3000 as a non-root user with a read-only root filesystem.
#
# ⚠ THIS IS WHAT CI APPLIES, AND THE NAMESPACE IS NOT IN IT ANY MORE.
#
# A Namespace is a CLUSTER-SCOPED resource, and the deploy role is scoped to one
# namespace — so `kubectl apply` on it failed with:
#
#   namespaces is forbidden: User ".../github-actions-cluelake-site/..." cannot
#   create resource "namespaces" in API group "" at the cluster scope
#
# That is the access model working, not a bug to widen. Granting cluster-scoped
# write to a marketing site's CI to save one manual step is the wrong trade, and
# `apply` would still fail on an EXISTING namespace because it reads before it
# writes. The namespace is prod/namespace.yaml, applied once by an admin.
#
# Routing (prod/routes.yaml) and TLS (prod/certificate.yaml) are also a cluster
# admin's, for the reason routes.yaml sets out at length.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluelake-site
  namespace: cluelake-site
  labels:
    app.kubernetes.io/name: cluelake-site
spec:
  # No replicas: the HorizontalPodAutoscaler below owns it (min 1, max 3).
  selector:
    matchLabels:
      app.kubernetes.io/name: cluelake-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluelake-site
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          # ⚠ SUBSTITUTED AT DEPLOY TIME, AND BY DIGEST. The workflow replaces
          # ${IMAGE} with the digest of the image it just built and pushed, so
          # the running spec names one exact artifact that cannot be retagged
          # under it. A tag is a promise; a digest is the thing.
          #
          # A placeholder in git rather than a committed digest, because the
          # alternative is CI pushing to main after every deploy — a bot commit
          # on a protected branch is a bigger door than this needs.
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            # Small and equal: a static file server should never be the reason a
            # node is under memory pressure.
            # ⚠ RAISED FROM THE NGINX FIGURES. A Node process with the Next.js
            # server in it does not fit in 64Mi; the old limits would OOMKill it
            # on the first request and look like a crash loop.
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            # ⚠ ONLY /tmp. The nginx cache mount is gone with nginx; a Node
            # server writes nothing else, and the root filesystem stays
            # read-only.
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            # ⚠ /healthz, NOT /. A probe that fetches the page goes green
            # whenever nginx can serve bytes, which it can before the assets are
            # in place.
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 8
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: cluelake-site
  namespace: cluelake-site
spec:
  selector:
    app.kubernetes.io/name: cluelake-site
  ports:
    - { name: http, port: 80, targetPort: 3000 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluelake-site
  namespace: cluelake-site
spec:
  # The site runs one pod when idle (see the HorizontalPodAutoscaler below).
  # minAvailable: 1 would then block every node drain and every consolidation
  # of that pod, so one pod may be moved at a time. A node roll costs a few
  # seconds of the page, which is the trade made for running one replica.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluelake-site
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cluelake-site
  namespace: cluelake-site
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cluelake-site
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
