<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ClueLake — Know what changed.</title>
    <meta
      name="description"
      content="Kubernetes observability. Logs, metrics, traces and network signals in one store, each stamped with the deploy, image digest and commit that produced it."
    />

    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./logo-180.png" />
    <meta name="theme-color" content="#0a0d12" />
    <link rel="canonical" href="https://cluelake.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClueLake" />
    <meta property="og:title" content="ClueLake — Know what changed." />
    <meta
      property="og:description"
      content="Telemetry with deployment context. One place for logs, metrics and traces."
    />
    <meta property="og:url" content="https://cluelake.com/" />
    <meta name="twitter:card" content="summary" />

    <!-- Preconnect before the stylesheet, so the font request does not wait on a
         fresh TLS handshake. The system stack in index.css renders correctly on
         its own if this never arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
